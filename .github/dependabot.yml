# Dependabot opens weekly update PRs. It has no auto-merge setting of its own:
# .github/workflows/dependabot-weekly-merge.yml merges the non-major PRs whose
# required test jobs and all other checks pass every Monday. Major version bumps
# are left for manual review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-dependencies:
        dependency-type: development
        # Majors get their own PRs so one breaking bump (e.g. a new Node engine
        # requirement) cannot block the safe minor/patch updates.
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
